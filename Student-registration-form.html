<!DOCTYPE html>
<html lang="en">

<head>
    <title>Student Registration Form</title>

    <style>
        h2 {
            text-align: center;
            color: #28527a;
        }

        td {
            padding: 10px;
        }
    </style>

    <script>
        function checkData() {

            var f = document.forms["studentForm"];

            var name = f["studentName"].value;
            var email = f["email"].value;
            var roll = f["rollNo"].value;
            var contact = f["contactNo"].value;

            var gender =
                document.querySelector('input[name="gender"]:checked');

            var course =
                document.querySelector('input[name="course"]:checked');

            if (name == "" || email == "" || roll == "" ||
                contact == "" || gender == null || course == null) {

                alert("Please fill all fields.");
                return false;
            }

            alert("Form submitted successfully!");
            return true;
        }
    </script>
</head>

<body>

    <h2>STUDENT REGISTRATION FORM</h2>

    <form name="studentForm" onsubmit="return checkData()">

        <table border="1" align="center">

            <tr>
                <td>Name</td>
                <td>
                    <input type="text" name="studentName">
                </td>
            </tr>

            <tr>
                <td>Email</td>
                <td>
                    <input type="email" name="email">
                </td>
            </tr>

            <tr>
                <td>Roll No</td>
                <td>
                    <input type="text" name="rollNo">
                </td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender" value="Male">
                    Male

                    <input type="radio" name="gender" value="Female">
                    Female
                </td>
            </tr>

            <tr>
                <td>Course</td>
                <td>
                    <input type="radio" name="course" value="MCA">
                    MCA

                    <input type="radio" name="course" value="BCA">
                    BCA
                </td>
            </tr>

            <tr>
                <td>Contact No</td>
                <td>
                    <input type="tel" name="contactNo">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                </td>
            </tr>

        </table>

    </form>

</body>

</html>
